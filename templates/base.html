<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Processos Seletivos{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="/">Início</a>
            {% if user.is_authenticated %}
                <span>{{ user.nome }}</span>
                <a href="{% url 'accounts:logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Entrar via gov.br</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
