{% extends "tema/base.html" %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Processo Seletivo{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Processo Seletivo</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
    <a href="{% if form.instance.pk %}{% url 'processos:detail' form.instance.pk %}{% else %}{% url 'processos:list' %}{% endif %}">Cancelar</a>
</form>
{% endblock %}
